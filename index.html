<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake News Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 0 10px #ccc;
        }
        textarea {
            width: 400px;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        h2 {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fake News Detection</h1>
        <form method="POST">
            <textarea name="news_text" placeholder="Enter news text here..." required></textarea><br>
            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
        <h2>Prediction: <span style="color: {{ 'green' if prediction=='REAL' else 'red' }}">{{ prediction }}</span></h2>
        {% endif %}
    </div>
</body>
</html>
